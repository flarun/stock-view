name: Build and Publish Release

on:
  push:
    tags:
      - "v*" # This workflow ONLY runs when you push a tag starting with "v" (e.g., v0.1.0-beta)

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev pkg-config ninja-build autoconf autoconf-archive automake libtool

      - name: Configure CMake
        shell: bash
        run: cmake -B build -S . -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build build --config Release

      - name: Package Application (CPack)
        run: |
          cd build
          cpack -C Release

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd build
          if [ "$RUNNER_OS" == "Windows" ]; then
            sha256sum *.zip > checksum-windows.sha256
          elif [ "$RUNNER_OS" == "macOS" ]; then
            shasum -a 256 *.dmg > checksum-macos.sha256
          else
            sha256sum *.deb > checksum-ubuntu.sha256
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.dmg
            build/*.zip
            build/*.sha256
          generate_release_notes: true
